<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartGradient" x1="48" y1="15" x2="48" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E03131" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 3D Heart Body -->
  <g filter="url(#softShadow)">
    <path d="M48 26C62 8 86 18 86 42C86 64 48 86 48 86C48 86 10 64 10 42C10 18 34 8 48 26Z" fill="url(#heartGradient)"/>
    <!-- Highlight for 3D effect -->
    <ellipse cx="28" cy="32" rx="12" ry="6" transform="rotate(-45 28 32)" fill="white" fill-opacity="0.3"/>
  </g>

  <!-- Heartbeat Line (ECG) -->
  <path d="M14 48H30L38 32L48 64L58 40L64 48H82" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>


</svg>
